<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Unavailable — Hugh Fletcher Photography</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0c;
      color: #f4f4f1;
      font-family: Inter, system-ui, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 650px;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 11px;
      font-weight: 700;
      color: #a5a5a2;
      margin-bottom: 20px;
    }

    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(50px, 8vw, 90px);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: -0.04em;
      margin: 0 0 28px;
    }

    p {
      color: #a5a5a2;
      font-size: 15px;
      line-height: 1.8;
      margin: 0 auto 35px;
      max-width: 520px;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 16px;

      padding: 13px 18px;

      border: 1px solid rgba(255,255,255,0.3);

      color: #f4f4f1;
      text-decoration: none;

      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;

      transition: 0.25s;
    }

    a:hover {
      background: #fff;
      color: #111;
      border-color: #fff;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="eyebrow">
      Contact
    </div>

    <h1>
      Currently unavailable.
    </h1>

    <p>
      Contact details aren't available yet. Please check back later.
    </p>

    <a href="index.html">
      ← Back to photography
    </a>

  </main>

</body>
</html>
