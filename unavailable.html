<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Unavailable — Hugh Fletcher Photography</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0b0c;
      color: #f4f4f1;
      font-family: Inter, system-ui, sans-serif;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.78) 0%,
          rgba(0, 0, 0, 0.45) 50%,
          rgba(0, 0, 0, 0.15) 100%
        ),
        linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.55),
          transparent 60%
        );
    }

    .content {
      position: absolute;
      left: clamp(24px, 7vw, 110px);
      bottom: clamp(50px, 10vw, 120px);
      max-width: 650px;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 11px;
      font-weight: 700;
      color: #c8c8c4;
      margin: 0 0 18px;
    }

    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(52px, 8vw, 100px);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: -0.05em;
      margin: 0 0 28px;
    }

    p {
      max-width: 520px;
      color: #ddd;
      font-size: 15px;
      line-height: 1.7;
      margin: 0 0 30px;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 18px;

      padding: 13px 18px;

      border: 1px solid rgba(255, 255, 255, 0.35);

      color: #f4f4f1;
      text-decoration: none;

      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;

      transition: 0.25s;
    }

    a:hover {
      background: #fff;
      color: #111;
      border-color: #fff;
    }

    @media (max-width: 600px) {
      .content {
        left: 22px;
        right: 22px;
        bottom: 45px;
      }

      h1 {
        font-size: clamp(48px, 14vw, 72px);
      }

      p {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <img
      src="images/01.jpg"
      alt="Photography by Hugh Fletcher"
    >

    <div class="overlay"></div>

    <div class="content">

      <p class="eyebrow">
        Contact
      </p>

      <h1>
        Currently unavailable.
      </h1>

      <p>
        Contact details aren't available yet. Please check back later.
      </p>

      <a href="index.html">
        ← Back to photography
      </a>

    </div>

  </main>

</body>
</html>
